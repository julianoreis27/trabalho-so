# Bancos para desenvolvimento local.
#   docker compose up -d dynamodb   -> DynamoDB Local em http://localhost:8000
#   docker compose up -d postgres   -> PostgreSQL em localhost:5432
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports:
      - "5432:5432"
